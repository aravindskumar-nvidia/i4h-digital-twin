[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin"
version = "0.1.0"
description = "Patient, hospital, robot, and simulation-ready digital twin modules."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "i4h" }]
dependencies = [
  "numpy>=1.24",
  "nibabel>=5.0",
  "PyYAML>=6.0",
  "scikit-image>=0.22",
  "boto3",
  "requests",
  "tqdm",
]

[project.optional-dependencies]
# Mirrors patient-digital-twin/pyproject.toml with a "patient-" prefix; a test keeps them in sync.
patient-usd = [
  "usd-core>=24.3; sys_platform != 'linux' or platform_machine != 'aarch64'",
  "usd-exchange>=2.2; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
patient-pipeline = ["digital-twin[patient-usd]", "vtk", "scipy>=1.10", "trimesh"]
patient-dicom = ["SimpleITK>=2.3.0"]
patient-nvsegment = ["torch>=2.4", "monai>=1.5", "pytorch-ignite>=0.5", "fire>=0.6", "einops>=0.7", "huggingface_hub>=0.20", "matplotlib>=3.7", "tqdm>=4.65", "scipy>=1.10"]
patient-nvgenerate = ["torch>=2.4", "monai>=1.5", "einops>=0.7", "huggingface_hub>=0.20", "matplotlib>=3.7", "tqdm>=4.65", "fire>=0.5", "tensorboard>=2.14", "scipy>=1.10"]
patient-editing = [
  "digital-twin[patient-pipeline]",
  "Pillow>=10",
  "mcp>=1.26,<2",
  "openai-codex>=0.163,<0.164",
  "claude-agent-sdk>=0.2.154,<0.3",
]
patient-texture = [
  "digital-twin[patient-pipeline]",
  "Pillow>=10",
  "torch>=2.4",
  "torchvision",
  "setuptools>=68",
  "wheel",
  "packaging",
  "ninja",
  "psutil",
  "easydict",
  "opencv-python-headless",
  "transformers>=4.56,<5",
  "huggingface_hub",
  "safetensors",
  "zstandard",
  "plyfile",
  "tqdm",
]
dev = ["digital-twin[patient-pipeline,patient-dicom]", "Pillow>=10", "pytest>=8.0", "mypy>=1.10", "pydicom>=2.4"]
patient-vasculature = ["SimpleITK>=2.3", "scipy>=1.10", "scikit-image>=0.22", "totalsegmentator>=2.7", "vtk>=9.2", "warp-lang>=1.3"]  # Deprecated vasculature_digital_twin.

[project.scripts]
patient-digital-twin = "patient_digital_twin.__main__:main"
patient-digital-twin-agent = "patient_digital_twin.agent.__main__:main"
i4h-asset-retrieve = "sim_ready_assets.cli:retrieve_main"
vdt-preprocess-ct = "vasculature_digital_twin.cli.preprocess_ct:main"  # Deprecated.
vdt-segment-vessels = "vasculature_digital_twin.cli.segment_vessels:main"  # Deprecated.

[tool.setuptools]
packages = [
  "hospital_digital_twin",
  "patient_digital_twin",
  "patient_digital_twin.agent",
  "patient_digital_twin.texturing",
  "robot_digital_twin",
  "sim_ready_assets",
  "vasculature_digital_twin",  # Deprecated.
  "vasculature_digital_twin.cli",
  "vasculature_digital_twin.ct",
]
package-dir = { hospital_digital_twin = "hospital-digital-twin/hospital_digital_twin", patient_digital_twin = "patient-digital-twin/patient_digital_twin", robot_digital_twin = "robot-digital-twin/robot_digital_twin", sim_ready_assets = "sim-ready-assets/sim_ready_assets", vasculature_digital_twin = "patient-digital-twin/vasculature_digital_twin" }
include-package-data = true

[tool.setuptools.package-data]
patient_digital_twin = ["data/textures/*.json", "data/textures/*.png", "data/anatomy/*.json", "data/anatomy/licenses/*", "data/anatomy/provenance/*"]
sim_ready_assets = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["patient-digital-twin/tests"]
addopts = "-v --tb=short"

[tool.codespell]
# Creator given name in the VOXEL-MAN reference credits.
ignore-words-list = "udo"
